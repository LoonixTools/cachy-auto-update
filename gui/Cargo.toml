# The window and the tray icon, drawn with Rune like Waypointer.
[package]
name = "cachy-auto-update-gui"
description = "Window and tray icon for cachy-auto-update"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cachy-auto-update = { path = ".." }
rune = { git = "https://github.com/anomalyco/rune.git", rev = "958743308f36fdf1c568c513badc96ddb0c7f040" }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }
futures-util = "0.3"
